name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          # 単体テストは外部依存なしの純ロジックのみ → heavy deps はインストール不要
          # ただし src/config.py / src/db.py 等が import されるため軽量依存は入れる
          pip install psycopg2-binary

      - name: Run unit tests
        env:
          GRIDWORLDRAG_SKIP_CONFIG: '1'
        run: |
          failed=0
          for t in tests/test_*.py; do
            echo "=== $t ==="
            if ! python "$t"; then
              failed=1
            fi
          done
          exit $failed

  pyflakes:
    name: pyflakes (未使用 import / 未定義変数検出)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pyflakes
        run: pip install pyflakes

      - name: Run pyflakes
        run: |
          pyflakes build_parallel.py src/ gridworld-rag-mcp/ sync_rotate.py tests/
