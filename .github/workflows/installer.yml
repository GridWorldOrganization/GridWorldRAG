name: Installer

# Builds the WinServerRAG installer (.exe) on a clean Windows runner and
# attaches it to the GitHub Release.
#
# Why GitHub Actions, not local builds:
#   - The Akasaka dev box has CUDA-enabled torch in the venv; PyInstaller
#     bundles ALL of it, producing 4 GB exes / 16 GB raw output. A clean
#     CI runner installs CPU-only torch by default, which keeps the
#     final installer at ~500-700 MB.
#   - electron-builder's winCodeSign extraction needs symlink-create
#     permission, which on Windows requires Developer Mode or admin.
#     GitHub-hosted runners run as an admin user, so symlinks Just Work.
#   - Reproducibility: the build is pinned to a specific runner image +
#     tag, so anyone can audit how the released exe was produced.
#
# Triggers:
#   - workflow_dispatch: manual run (e.g., to rebuild for a draft Release).
#   - release.published: every time a Release is published, build and
#     upload the installer as a Release asset.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version baked into the installer filename (e.g. 1.3.0)"
        required: true
        default: "1.3.0"
      release_tag:
        description: "Existing Release tag to upload to (e.g. v1.3.0). Leave blank to skip upload."
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: write   # gh release upload

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps + PyInstaller
        # Use a clean side-by-side venv (.venv) so the build doesn't
        # accidentally reuse cached state from a prior run. requirements.txt
        # pulls CPU torch by default — this is what we want here.
        #
        # `python -m pip install --upgrade pip` (NOT `pip install --upgrade pip`):
        # on Windows, pip refuses to overwrite its own running .exe, but
        # the `python -m pip` form invokes pip via the interpreter so the
        # rename-on-replace works.
        shell: bash
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install --upgrade pip
          ./.venv/Scripts/python.exe -m pip install -r requirements.txt
          ./.venv/Scripts/python.exe -m pip install pyinstaller

      - name: Install Inno Setup 6 via choco
        shell: pwsh
        # Chocolatey is preinstalled on windows-latest runners. innosetup
        # ends up at "C:\Program Files (x86)\Inno Setup 6\" which build.ps1
        # already probes for.
        run: |
          choco install innosetup --no-progress --yes
          # Verify
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            Write-Error "ISCC.exe not found after install"
            exit 1
          }

      - name: Install NSSM via choco (cached)
        shell: pwsh
        # nssm.cc has been flaky (503s). Choco mirror is reliable.
        #
        # CRITICAL: `Get-Command nssm` returns Chocolatey's SHIM at
        # C:\ProgramData\chocolatey\bin\nssm.exe. The shim is a tiny
        # (~60KB) wrapper that delegates to the real binary at
        # C:\ProgramData\chocolatey\lib\NSSM\tools\win64\nssm.exe at
        # runtime. If we copy the SHIM into the installer, it ends up
        # at C:\Program Files\WinServerRAG\bin\nssm.exe and tries to
        # find ..\lib\NSSM\tools\nssm.exe — which doesn't exist on the
        # operator's machine. Result: every `nssm install` and
        # `nssm set` returns exit -1, services never register.
        #
        # This was the root cause of the v1.3.0 install failure chain.
        # The Group-Exists / NativeCommandError fixes (PR #37, #41)
        # were real bugs but downstream symptoms — install would have
        # failed at the next nssm call regardless.
        #
        # Fix: copy the REAL nssm.exe from the choco lib subtree.
        # Verify size > 200KB (real nssm-2.24 win64 is ~370KB; shim
        # is ~60KB) so a future packaging change doesn't silently
        # regress.
        run: |
          choco install nssm --no-progress --yes
          # Find the REAL nssm.exe — NOT the Chocolatey shim.
          #
          # Choco's nssm package extracts arch-specific binaries somewhere
          # under C:\ProgramData\chocolatey\, but the exact path varies:
          # `lib\nssm\tools\win64\`, `lib.installed\nssm\tools\win64\`,
          # and a few variants depending on choco version + cache state.
          #
          # Cheaper than guessing paths: recursive scan for nssm.exe,
          # then filter by VersionInfo.FileDescription. The shim has
          # "Chocolatey Shim"; the real binary has "the Non-Sucking
          # Service Manager". Also keep a size>200KB safety net (real
          # nssm-2.24 win64 is ~370KB; shim ~60KB).
          Write-Host "--- Probing chocolatey directory for nssm.exe ---"
          $allNssm = Get-ChildItem -Path "C:\ProgramData\chocolatey" -Recurse `
            -Filter "nssm.exe" -ErrorAction SilentlyContinue |
            ForEach-Object {
              [pscustomobject]@{
                Path  = $_.FullName
                Size  = $_.Length
                Desc  = $_.VersionInfo.FileDescription
              }
            }
          $allNssm | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          # Keep only candidates that are REAL nssm (not shim) AND look like 64-bit.
          $real = $allNssm | Where-Object {
            $_.Size -gt 200000 -and
            $_.Desc -notmatch "Shim" -and
            ($_.Path -match "win64" -or $_.Path -notmatch "win32")
          }
          if (-not $real) {
            Write-Error "No real nssm.exe found anywhere under C:\ProgramData\chocolatey. Listed candidates above."
            exit 1
          }
          # Prefer one whose path explicitly contains "win64".
          $win64 = $real | Where-Object { $_.Path -match "win64" } | Select-Object -First 1
          $nssm = if ($win64) { $win64 } else { $real | Select-Object -First 1 }
          New-Item -ItemType Directory -Force -Path "installer/inno/assets" | Out-Null
          Copy-Item -Force $nssm.Path "installer/inno/assets/nssm.exe"
          Write-Host ("Copied REAL nssm.exe ({0} bytes, '{1}') from {2}" -f $nssm.Size, $nssm.Desc, $nssm.Path)

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            # Strip leading "v" from the tag (v1.3.0 → 1.3.0).
            VER="${{ github.event.release.tag_name }}"
            VER="${VER#v}"
          else
            VER="${{ github.event.inputs.version }}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VER"

      - name: Build installer (PyInstaller + electron-builder + Inno Setup)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File installer/build.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Show installer size
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/WinServerRAG-Setup-*.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "No installer .exe in dist/"; exit 1 }
          Write-Host "Built: $($exe.FullName)"
          Write-Host "Size:  $([math]::Round($exe.Length / 1MB, 1)) MB"

      - name: Upload artifact (always, even on workflow_dispatch)
        uses: actions/upload-artifact@v4
        with:
          name: WinServerRAG-Setup-${{ steps.ver.outputs.version }}
          path: dist/WinServerRAG-Setup-*.exe
          retention-days: 30
          if-no-files-found: error

      - name: Upload to GitHub Release (release event or explicit tag)
        if: github.event_name == 'release' || github.event.inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ("${{ github.event_name }}" -eq "release") {
            "${{ github.event.release.tag_name }}"
          } else {
            "${{ github.event.inputs.release_tag }}"
          }
          $exe = (Get-ChildItem dist/WinServerRAG-Setup-*.exe | Select-Object -First 1).FullName
          Write-Host "Uploading $exe to release $tag..."
          gh release upload $tag $exe --clobber
