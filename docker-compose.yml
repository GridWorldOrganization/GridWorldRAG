# GridWorldRAG 用 docker-compose
# 注意: v0.2.x では公式サポート外（動作確認推奨）
#
# 起動: docker compose up -d
# 停止: docker compose down
# ログ: docker compose logs -f

services:
  pg:
    image: pgvector/pgvector:pg17
    container_name: gridworldrag-pg
    environment:
      POSTGRES_USER: gridworldrag
      POSTGRES_PASSWORD: ${PG_PASSWORD:-change_me}
      POSTGRES_DB: gridworldrag_1
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridworldrag"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: gridworldrag-app
    depends_on:
      pg:
        condition: service_healthy
    environment:
      # config.env で定義する変数を環境変数として渡す
      PG_HOST: pg
      PG_PORT: 5432
      PG_DB: gridworldrag_1
      PG_USER: gridworldrag
      PG_PASSWORD: ${PG_PASSWORD:-change_me}
      GOOGLE_EMAIL: ${GOOGLE_EMAIL}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      PARALLEL_WORKERS: ${PARALLEL_WORKERS:-4}
    volumes:
      # token.pickle を永続化（OAuth キャッシュ）
      - ./token.pickle:/app/token.pickle
      - ./shared_drives_whitelist.txt:/app/shared_drives_whitelist.txt:ro
    restart: unless-stopped
    # MCP サーバーは stdio なので、ここでは起動のみ（Claude Code 側から attach する想定）
    # 初回ビルドを実行する場合は一時的に `command: python build_parallel.py` に変更

volumes:
  pg_data:
    name: gridworldrag_pg_data
