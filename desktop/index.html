<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>WinServerRAG Mini</title>
  <style>
    :root {
      --bg: #0f1115; --fg: #e7ecf3; --muted: #8a93a6;
      --accent: #5ea4ff; --ok: #3fbf7f; --err: #ff6b6b; --warn: #f2b94b;
      --border: #232a3b;
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px; overflow: hidden; }
    .wrap {
      padding: 12px; display: flex; flex-direction: column;
      height: 100vh; box-sizing: border-box; gap: 8px;
    }
    .header-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
    }
    h1 { margin: 0; font-size: 14px; font-weight: 600;
      display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .header-btn {
      background: var(--accent); color: #fff; border: none; border-radius: 4px;
      padding: 4px 10px; font-size: 11px; cursor: pointer;
      white-space: nowrap; flex-shrink: 0;
    }
    .header-btn:hover { filter: brightness(1.1); }
    .aot-toggle {
      flex-shrink: 0; margin: 0 0 0 2px; cursor: pointer;
      width: 14px; height: 14px; accent-color: var(--accent);
    }

    /* Status indicator — morphs based on state.
       idle:     small dim dot
       ok:       green pulsing dot
       active:   rotating ring (building)
       error:    red solid dot */
    .indicator {
      position: relative; width: 16px; height: 16px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .indicator .core {
      width: 8px; height: 8px; border-radius: 50%; background: var(--muted);
      transition: background 0.2s;
    }
    .indicator.ok  .core { background: var(--ok); animation: pulse 1.6s ease-in-out infinite; }
    .indicator.err .core { background: var(--err); }
    .indicator.active::before {
      content: ""; position: absolute; inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--accent);
      border-right-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }
    .indicator.active .core { background: var(--accent); }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { transform: scale(1);   opacity: 1; }
      50%      { transform: scale(1.4); opacity: 0.55; }
    }

    /* Aggregate progress — shimmers while active */
    .topbar { display: flex; flex-direction: column; gap: 4px; }
    .progress-agg {
      height: 4px; background: #1b2030; border-radius: 2px; overflow: hidden;
      position: relative;
    }
    .progress-agg .fill {
      height: 100%; background: var(--accent);
      transition: width 0.45s ease-out;
    }
    .progress-agg.active .fill {
      background: linear-gradient(90deg, var(--accent) 0%, #a0c9ff 50%, var(--accent) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.4s linear infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .progress-label {
      display: flex; justify-content: space-between; font-size: 10px; color: var(--muted);
    }
    .progress-label .tick { color: var(--accent); opacity: 0; }
    .progress-label .tick.on { animation: blink 0.5s ease-in-out; opacity: 1; }
    @keyframes blink { 0%{opacity:1} 100%{opacity:0} }
    .rows { display: flex; flex-direction: column; gap: 5px; flex: 1; font-size: 12px; }
    .row { display: flex; justify-content: space-between; border-bottom: 1px dotted var(--border); padding-bottom: 3px; }
    .row .k { color: var(--muted); }
    .row .v { color: var(--fg); font-variant-numeric: tabular-nums; }
    .row .v.accent { color: var(--accent); }
    .row .v.err    { color: var(--err); }
    .row .v.ok     { color: var(--ok); }
    .workers-mini { font-size: 11px; color: var(--muted); max-height: 60px; overflow-y: auto; }
    .workers-mini .w { display: inline-block; margin-right: 6px; padding: 1px 6px;
      background: #14243d; color: var(--accent); border-radius: 8px; }
    .workers-mini .w.idle { background: #1b2030; color: var(--muted); }
    .workers-mini .w.error { background: #33181c; color: var(--err); }
    .workers-mini .w.stale {
      background: #2d2418; color: var(--warn);
      text-decoration: line-through dotted;
    }
    footer { display: flex; justify-content: flex-end; align-items: center; font-size: 11px; }
    .muted { color: var(--muted); font-size: 11px; }
    .err { color: var(--err); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header-row">
      <h1>
        <span id="indicator" class="indicator"><span class="core"></span></span>
        WinServerRAG
      </h1>
      <button id="open-btn" class="header-btn" title="ブラウザでフル Monitor を開く">Monitor を開く</button>
      <input type="checkbox" id="aot-toggle" class="aot-toggle" title="常に最前面に表示">
    </div>
    <div class="topbar">
      <div id="progress-agg" class="progress-agg"><div class="fill" id="progress-fill" style="width:0"></div></div>
      <div class="progress-label">
        <span id="progress-text">—</span>
        <span id="progress-tick" class="tick">●</span>
      </div>
    </div>
    <div class="topbar" title="有効ドライブのインデックス済み / 推定合計">
      <div id="progress-global" class="progress-agg"><div class="fill" id="progress-global-fill" style="width:0"></div></div>
      <div class="progress-label">
        <span class="muted">全体 (ON分):</span>
        <span id="progress-global-text">—</span>
      </div>
    </div>
    <div class="rows">
      <div class="row"><span class="k">PG / Drive</span><span class="v" id="conns">- / -</span></div>
      <div class="row"><span class="k">FDs enabled</span><span class="v" id="fds">-/-</span></div>
      <div class="row"><span class="k">Files</span><span class="v accent" id="files">-</span></div>
      <div class="row"><span class="k">Chunks</span><span class="v accent" id="chunks">-</span></div>
      <div class="row"><span class="k">DB size</span><span class="v" id="dbsize">-</span></div>
      <div class="row"><span class="k">Workers</span><span class="v" id="wsummary">-</span></div>
      <div class="workers-mini" id="wdetail"></div>
    </div>
    <footer>
      <span class="muted" id="api-url"></span>
    </footer>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
